name: SwingFit
options:
  bundleIdPrefix: com.prachayawut.swingfit
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: QRPJ6S6PC6
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"

targets:
  SwingFit:
    type: application
    platform: iOS
    sources:
      - path: SwingFit
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prachayawut.swingfit.app
        INFOPLIST_FILE: SwingFit/Info.plist
        CODE_SIGN_ENTITLEMENTS: SwingFit/SwingFit.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OPENROUTER_API_KEY: ""
        GEMINI_API_KEY: ""
      configFiles:
        Debug: Config/Debug.xcconfig
        Release: Config/Release.xcconfig
    dependencies:
      - target: SwingFitWatch

  SwingFitWatch:
    type: application
    platform: watchOS
    sources:
      - path: SwingFitWatch
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prachayawut.swingfit.app.watchkitapp
        INFOPLIST_FILE: SwingFitWatch/Info.plist
        CODE_SIGN_ENTITLEMENTS: SwingFitWatch/SwingFitWatch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  SwingFitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: Shared
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: SwingFit
